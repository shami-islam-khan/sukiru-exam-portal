<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/logo.png">
    <title>Japanese Lesson 8 Practice</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: #ffffff; width: 100%; max-width: 650px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); padding: 25px; }
        
        .tab-buttons { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #edf2f7; padding-bottom: 10px; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: #e2e8f0; color: #4a5568; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .tab-btn.active { background: #2b6cb0; color: white; }

        .form-group { margin-bottom: 15px; }
        label { font-weight: 600; font-size: 0.9rem; color: #4a5568; display: block; margin-bottom: 5px; }
        select { width: 100%; padding: 10px; border: 1.5px solid #cbd5e0; border-radius: 8px; font-size: 0.95rem; outline: none; background: white; }
        select:focus { border-color: #2b6cb0; }

        .btn-primary { width: 100%; padding: 12px; background: #2b6cb0; color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-primary:hover { background: #2c5282; }

        /* Flashcard Styles */
        .card-box { background: #edf2f7; border-radius: 12px; padding: 25px; text-align: center; margin-top: 15px; min-height: 200px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .jp-text { font-size: 2.2rem; font-weight: bold; color: #2d3748; margin-bottom: 5px; }
        .kanji-text { font-size: 1.2rem; color: #718096; margin-bottom: 15px; }
        .mean-text { font-size: 1.1rem; color: #2b6cb0; font-weight: 600; }
        .nav-btns { display: flex; gap: 10px; margin-top: 15px; }
        .nav-btn { flex: 1; padding: 10px; background: #4a5568; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }

        /* Quiz Styles */
        .progress { font-size: 0.9rem; color: #718096; font-weight: 600; margin-bottom: 10px; }
        .options-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 15px; }
        .opt-btn { background: #edf2f7; color: #2d3748; border: 2px solid #e2e8f0; font-size: 0.95rem; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: 600; text-align: left; transition: 0.2s; }
        .opt-btn:hover:not([disabled]) { background: #e2e8f0; }
        .opt-btn.correct { background: #48bb78 !important; color: white !important; border-color: #38a169 !important; }
        .opt-btn.wrong { background: #f56565 !important; color: white !important; border-color: #e53e3e !important; }

        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="tab-buttons">
        <button class="tab-btn active" onclick="switchMode('study', event)">Study (ফ্ল্যাশকার্ড)</button>
        <button class="tab-btn" onclick="switchMode('quiz', event)">Quiz (কুইজ)</button>
    </div>

    <!-- FLASHCARD MODE -->
    <div id="study-view">
        <div class="form-group">
            <label for="study-cat">ক্যাটাগরি নির্বাচন করুন:</label>
            <select id="study-cat" onchange="loadCategoryWords()">
                <option value="all">সব একসাথে (All Vocabulary)</option>
                <option value="na_adj">な-বিশেষণ (Na-Adjectives)</option>
                <option value="i_adj">い-বিশেষণ (I-Adjectives)</option>
                <option value="nouns">বিশেষ্য ও নাম (Nouns & Proper Nouns)</option>
                <option value="adverbs">ক্রিয়াবিশেষণ ও সংযোগকারী (Adverbs & Conjunctions)</option>
                <option value="phrases">বাক্য ও কথোপকথন (Phrases & Expressions)</option>
            </select>
        </div>

        <div class="card-box">
            <div class="jp-text" id="fc-jp">ハンサム [な]</div>
            <div class="kanji-text" id="fc-kanji">ハンサム [な] (hansamu)</div>
            <div class="mean-text" id="fc-mean">সুন্দর / Handsome</div>
        </div>

        <div class="nav-btns">
            <button class="nav-btn" onclick="prevCard()">আগেরটি</button>
            <button class="nav-btn" onclick="toggleMeaning()">অর্থ লুকান/দেখুন</button>
            <button class="nav-btn" onclick="nextCard()">পরেরটি</button>
        </div>
    </div>

    <!-- QUIZ SETUP MODE -->
    <div id="quiz-setup" class="hidden">
        <h2 style="font-size: 1.3rem; color: #2d3748; margin-bottom: 15px;">Lesson 8 Quiz Setup</h2>
        <div class="form-group">
            <label for="quiz-cat">ক্যাটাগরি:</label>
            <select id="quiz-cat">
                <option value="all">সব একসাথে (All)</option>
                <option value="na_adj">な-বিশেষণ (Na-Adjectives)</option>
                <option value="i_adj">い-বিশেষণ (I-Adjectives)</option>
                <option value="nouns">বিশেষ্য ও নাম (Nouns & Proper Nouns)</option>
                <option value="adverbs">ক্রিয়াবিশেষণ ও সংযোগকারী (Adverbs & Conjunctions)</option>
                <option value="phrases">বাক্য ও কথোপকথন (Phrases & Expressions)</option>
            </select>
        </div>
        <div class="form-group">
            <label for="quiz-limit">প্রশ্নের সংখ্যা:</label>
            <select id="quiz-limit">
                <option value="10">10 Questions</option>
                <option value="20">20 Questions</option>
                <option value="all">সবগুলো</option>
            </select>
        </div>
        <button class="btn-primary" onclick="startQuiz()">কুইজ শুরু করুন</button>
    </div>

    <!-- QUIZ ACTIVE MODE -->
    <div id="quiz-active" class="hidden">
        <div class="progress" id="quiz-progress">Question 1 of 10</div>
        <div class="card-box" style="min-height: 120px;">
            <div class="jp-text" id="qz-question">ハンサム [な]</div>
        </div>
        <div class="options-grid" id="qz-options"></div>
    </div>

    <!-- QUIZ RESULT MODE -->
    <div id="quiz-result" class="hidden" style="text-align: center;">
        <h2 style="color: #2d3748;">কুইজ সম্পন্ন হয়েছে!</h2>
        <p id="qz-score" style="font-size: 1.2rem; font-weight: bold; color: #2b6cb0; margin: 20px 0;"></p>
        <button class="btn-primary" onclick="resetQuiz()">আবার চেষ্টা করুন</button>
    </div>
</div>

<script>
const lesson8Data = {
    na_adj: [
        {j: "ハンサム [な]", k: "ハンサム [な]", r: "hansamu [na]", bn: "সুন্দর", en: "Handsome"},
        {j: "きれい [な]", k: "きれい [な]", r: "kirei [na]", bn: "সুন্দর, পরিষ্কার", en: "Beautiful, clean"},
        {j: "しずか [な]", k: "静か [な]", r: "shizuka [na]", bn: "শান্ত", en: "Quiet"},
        {j: "にぎやか [な]", k: "にぎやか [な]", r: "nigiyaka [na]", bn: "প্রাণবন্ত", en: "Lively"},
        {j: "ゆうめい [な]", k: "有名 [な]", r: "yuumei [na]", bn: "বিখ্যাত", en: "Famous"},
        {j: "しんせつ [な]", k: "親切 [な]", r: "shinsetsu [na]", bn: "দয়ালু", en: "Kind"},
        {j: "げんき [な]", k: "元気 [な]", r: "genki [na]", bn: "স্বাস্থ্যবান, প্রাণোচ্ছ্বল", en: "Healthy, sound, cheerful"},
        {j: "ひま [な]", k: "暇 [な]", r: "hima [na]", bn: "অবসর সময়", en: "Free (time)"},
        {j: "べんり [な]", k: "便利 [な]", r: "benri [na]", bn: "সুবিধাজনক", en: "Convenient"},
        {j: "すてき [な]", k: "すてき [な]", r: "suteki [na]", bn: "সুন্দর, চমৎকার", en: "Fine, nice, wonderful"}
    ],
    i_adj: [
        {j: "おおきい", k: "大きい", r: "ookii", bn: "বড়", en: "Big, large"},
        {j: "ちいさい", k: "小さい", r: "chiisai", bn: "ছোট", en: "Small, little"},
        {j: "あたらしい", k: "新しい", r: "atarashii", bn: "নতুন", en: "New"},
        {j: "ふるい", k: "古い", r: "furui", bn: "পুরাতন (বয়স নয়)", en: "Old (not of age)"},
        {j: "いい (よい)", k: "いい (よい)", r: "ii (yoi)", bn: "ভালো", en: "Good"},
        {j: "わるい", k: "悪い", r: "warui", bn: "খারাপ", en: "Bad"},
        {j: "あつい", k: "暑い", r: "atsui", bn: "গরম", en: "Hot"},
        {j: "さむい", k: "寒い", r: "samui", bn: "ঠান্ডা (তাপমাত্রা)", en: "Cold (referring to temperature)"},
        {j: "つめたい", k: "冷たい", r: "tsumetai", bn: "ঠান্ডা (স্পর্শ করে)", en: "Cold (referring to touch)"},
        {j: "むずかしい", k: "難しい", r: "muzukashii", bn: "কঠিন", en: "Difficult"},
        {j: "やさしい", k: "易しい", r: "yasashii", bn: "সহজ", en: "Easy"},
        {j: "たかい", k: "高い", r: "takai", bn: "ব্যয়বহুল, লম্বা, উঁচু", en: "Expensive, tall, high"},
        {j: "やすい", k: "安い", r: "yasui", bn: "মিতব্যয়ী, সস্তা", en: "Inexpensive"},
        {j: "ひくい", k: "低い", r: "hikui", bn: "কম, নিম্ন", en: "Low"},
        {j: "おもしろい", k: "面白い", r: "omoshiroi", bn: "মজার", en: "Interesting"},
        {j: "おいしい", k: "おいしい", r: "oishii", bn: "সুস্বাদু", en: "Delicious, tasty"},
        {j: "いそがしい", k: "忙しい", r: "isogashii", bn: "ব্যস্ত", en: "Busy"},
        {j: "たのしい", k: "楽しい", r: "tanoshii", bn: "উপভোগ্য", en: "Enjoyable"},
        {j: "しろい", k: "白い", r: "shiroi", bn: "সাদা", en: "White"},
        {j: "くろい", k: "黒い", r: "kuroi", bn: "কালো", en: "Black"},
        {j: "あかい", k: "赤い", r: "akai", bn: "লাল", en: "Red"},
        {j: "あおい", k: "青い", r: "aoi", bn: "নীল", en: "Blue"}
    ],
    nouns: [
        {j: "さくら", k: "桜", r: "sakura", bn: "চেরি ফুল", en: "Cherry (blossom)"},
        {j: "やま", k: "山", r: "yama", bn: "পর্বত", en: "Mountain"},
        {j: "まち", k: "町", r: "machi", bn: "শহর", en: "Town, city"},
        {j: "たべもの", k: "食べ物", r: "tabemono", bn: "খাবার", en: "Food"},
        {j: "くるま", k: "車", r: "kuruma", bn: "গাড়ি", en: "Car"},
        {j: "ところ", k: "所", r: "tokoro", bn: "স্থান, জায়গা", en: "Place"},
        {j: "りょう", k: "寮", r: "ryou", bn: "ছাত্র হোস্টেল", en: "Dormitory, Hostel"},
        {j: "べんきょう", k: "勉強", r: "benkyou", bn: "পড়াশোনা", en: "Study"},
        {j: "せいかつ", k: "生活", r: "seikatsu", bn: "জীবন", en: "Life"},
        {j: "おしごと", k: "お仕事", r: "oshigoto", bn: "কাজ, ব্যবসা", en: "Work, business"},
        {j: "ふじさん", k: "富士山", r: "fujisan", bn: "মাউন্ট ফুজি", en: "Mt. Fuji"},
        {j: "びわこ", k: "琵琶湖", r: "biwako", bn: "লেক বিওয়া", en: "Lake Biwa"},
        {j: "シャンハイ", k: "上海", r: "shanhai", bn: "সাংহাই", en: "Shanghai"},
        {j: "しちにんのさむらい", k: "七人の侍", r: "shichinin no samurai", bn: "সেভেন সামুরাই", en: "The Seven Samurai"},
        {j: "きんかくじ", k: "金閣寺", r: "kinkakuji", bn: "কিস্কাকুজি (স্বর্ণ মন্দির)", en: "Kinkakuji Temple"}
    ],
    adverbs: [
        {j: "どう", k: "どう", r: "dou", bn: "কীভাবে / কেমন", en: "How"},
        {j: "どんな～", k: "どんな～", r: "donna~", bn: "কোন ধরনের～", en: "What kind of~"},
        {j: "どれ", k: "どれ", r: "dore", bn: "কোনটি (তিনটি বা অধিক)", en: "Which one (of three or more)"},
        {j: "とても", k: "とても", r: "totemo", bn: "খুব", en: "Very"},
        {j: "あまり", k: "あまり", r: "amari", bn: "ততোটা না (না-বোধক)", en: "Not so (used to negative)"},
        {j: "そして", k: "そして", r: "soshite", bn: "এবং (দুটি বাক্যকে যোগ করে)", en: "And (used to connect sentences)"},
        {j: "～が、～", k: "～が、～", r: "~ga, ~", bn: "～, কিন্তু ～", en: "~, but ~"}
    ],
    phrases: [
        {j: "おげんきですか", k: "お元気ですか", r: "ogenki desu ka", bn: "কেমন আছেন/আছো?", en: "How are you?"},
        {j: "そうですね", k: "そうですね", r: "sou desu ne", bn: "ভালো/আমাকে ভাবতে দিন (বিরতি)", en: "Well let me see. (pausing)"},
        {j: "にほんのせいかつになれましたか", k: "日本の生活に慣れましたか", r: "nihon no seikatsu ni naremashita ka", bn: "আপনি কি জাপানি জীবন যাপনে অভ্যস্ত?", en: "Have you got used to the life in Japan?"},
        {j: "[～、]もういっぱいいかがですか", k: "[～、]もう一杯いかがですか", r: "[~,] mou ippai ikaga desu ka", bn: "আর এক কাপ দেবো কি?", en: "Won't you have another cup of [~]?"},
        {j: "いいえ、けっこうです", k: "いいえ、けっこうです", r: "iie, kekkou desu", bn: "না, আপনাকে ধন্যবাদ", en: "No, thank you."},
        {j: "もう～です [ね]", k: "もう～です [ね]", r: "mou ~ desu [ne]", bn: "এটা ইতিমধ্যে ～ তাই নয় কি?", en: "It's already ~ [isn't it?]"},
        {j: "そろそろ しつれいします", k: "そろそろ 失礼します", r: "sorosoro shitsureishimasu", bn: "এখন যাওয়ার সময় হয়ে গেছে", en: "It's almost time to leave now."},
        {j: "また いらっしゃってください", k: "また いらっしゃってください", r: "mata irasshatte kudasai", bn: "দয়া করে আবার আসবেন।", en: "Please come again."}
    ]
};

// FLASHCARD VARS
let currentCardList = [];
let cardIndex = 0;
let showMean = true;

// QUIZ VARS
let quizList = [];
let quizIndex = 0;
let score = 0;

function switchMode(mode, event) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById('study-view').classList.add('hidden');
    document.getElementById('quiz-setup').classList.add('hidden');
    document.getElementById('quiz-active').classList.add('hidden');
    document.getElementById('quiz-result').classList.add('hidden');

    if (mode === 'study') {
        if (event) event.target.classList.add('active');
        document.getElementById('study-view').classList.remove('hidden');
        loadCategoryWords();
    } else {
        if (event) event.target.classList.add('active');
        document.getElementById('quiz-setup').classList.remove('hidden');
    }
}

function loadCategoryWords() {
    const cat = document.getElementById('study-cat').value;
    if (cat === 'all') {
        currentCardList = [];
        Object.keys(lesson8Data).forEach(k => currentCardList.push(...lesson8Data[k]));
    } else {
        currentCardList = [...lesson8Data[cat]];
    }
    cardIndex = 0;
    renderCard();
}

function renderCard() {
    const item = currentCardList[cardIndex];
    document.getElementById('fc-jp').innerText = item.j;
    document.getElementById('fc-kanji').innerText = `${item.k} (${item.r})`;
    const meanElem = document.getElementById('fc-mean');
    meanElem.innerText = `${item.bn} / ${item.en}`;
    meanElem.style.visibility = showMean ? 'visible' : 'hidden';
}

function nextCard() {
    cardIndex = (cardIndex + 1) % currentCardList.length;
    renderCard();
}

function prevCard() {
    cardIndex = (cardIndex - 1 + currentCardList.length) % currentCardList.length;
    renderCard();
}

function toggleMeaning() {
    showMean = !showMean;
    renderCard();
}

// QUIZ LOGIC
function startQuiz() {
    const cat = document.getElementById('quiz-cat').value;
    const limit = document.getElementById('quiz-limit').value;

    let pool = [];
    if (cat === 'all') {
        Object.keys(lesson8Data).forEach(k => pool.push(...lesson8Data[k]));
    } else {
        pool = [...lesson8Data[cat]];
    }

    pool.sort(() => Math.random() - 0.5);
    const count = limit === 'all' ? pool.length : Math.min(parseInt(limit), pool.length);
    quizList = pool.slice(0, count);

    quizIndex = 0;
    score = 0;

    document.getElementById('quiz-setup').classList.add('hidden');
    document.getElementById('quiz-active').classList.remove('hidden');
    showQuizQuestion();
}

function showQuizQuestion() {
    const q = quizList[quizIndex];
    document.getElementById('quiz-progress').innerText = `Question ${quizIndex + 1} of ${quizList.length}`;
    document.getElementById('qz-question').innerText = q.j;

    let allPool = [];
    Object.keys(lesson8Data).forEach(k => allPool.push(...lesson8Data[k]));

    let options = [q];
    while (options.length < 4) {
        let rand = allPool[Math.floor(Math.random() * allPool.length)];
        if (!options.some(opt => opt.j === rand.j)) options.push(rand);
    }
    options.sort(() => Math.random() - 0.5);

    const container = document.getElementById('qz-options');
    container.innerHTML = '';
    options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerText = `${opt.bn} (${opt.en})`;
        btn.dataset.correct = (opt.j === q.j);
        btn.onclick = (e) => handleAnswer(e.target, opt.j === q.j);
        container.appendChild(btn);
    });
}

function handleAnswer(btn, isCorrect) {
    const allBtns = document.querySelectorAll('.opt-btn');
    allBtns.forEach(b => b.disabled = true);

    if (isCorrect) {
        btn.classList.add('correct');
        score++;
    } else {
        btn.classList.add('wrong');
        allBtns.forEach(b => {
            if (b.dataset.correct === 'true') b.classList.add('correct');
        });
    }

    setTimeout(() => {
        quizIndex++;
        if (quizIndex < quizList.length) {
            showQuizQuestion();
        } else {
            showQuizResult();
        }
    }, 1000);
}

function showQuizResult() {
    document.getElementById('quiz-active').classList.add('hidden');
    document.getElementById('quiz-result').classList.remove('hidden');
    document.getElementById('qz-score').innerText = `আপনি ${quizList.length} টির মধ্যে ${score} টি সঠিক উত্তর দিয়েছেন!`;
}

function resetQuiz() {
    document.getElementById('quiz-result').classList.add('hidden');
    document.getElementById('quiz-setup').classList.remove('hidden');
}

// Initial Load
loadCategoryWords();
</script>
</body>
</html>
