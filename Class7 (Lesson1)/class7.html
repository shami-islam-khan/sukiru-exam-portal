<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/logo.png">
    <title>Japanese Lesson 1 Practice</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: #ffffff; width: 100%; max-width: 600px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); padding: 25px; }
        
        .tab-buttons { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #edf2f7; padding-bottom: 10px; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: #e2e8f0; color: #4a5568; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .tab-btn.active { background: #3182ce; color: white; }

        .form-group { margin-bottom: 15px; }
        label { font-weight: 600; font-size: 0.9rem; color: #4a5568; display: block; margin-bottom: 5px; }
        select { width: 100%; padding: 10px; border: 1.5px solid #cbd5e0; border-radius: 8px; font-size: 0.95rem; outline: none; background: white; }
        select:focus { border-color: #3182ce; }

        .btn-primary { width: 100%; padding: 12px; background: #3182ce; color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-primary:hover { background: #2b6cb0; }

        /* Flashcard Styles */
        .card-box { background: #edf2f7; border-radius: 12px; padding: 30px; text-align: center; margin-top: 15px; min-height: 180px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .jp-text { font-size: 2.2rem; font-weight: bold; color: #2d3748; margin-bottom: 5px; }
        .kanji-text { font-size: 1.2rem; color: #718096; margin-bottom: 15px; }
        .mean-text { font-size: 1.1rem; color: #2b6cb0; font-weight: 600; }
        .nav-btns { display: flex; gap: 10px; margin-top: 15px; }
        .nav-btn { flex: 1; padding: 10px; background: #4a5568; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }

        /* Quiz Styles */
        .progress { font-size: 0.9rem; color: #718096; font-weight: 600; margin-bottom: 10px; }
        .options-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 15px; }
        .opt-btn { background: #edf2f7; color: #2d3748; border: 2px solid #e2e8f0; font-size: 0.95rem; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: 600; text-align: left; transition: 0.2s; }
        .opt-btn:hover:not([disabled]) { background: #e2e8f0; }
        .opt-btn.correct { background: #48bb78 !important; color: white !important; border-color: #38a169 !important; }
        .opt-btn.wrong { background: #f56565 !important; color: white !important; border-color: #e53e3e !important; }

        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="tab-buttons">
        <button class="tab-btn active" onclick="switchMode('study')">Study (ফ্ল্যাশকার্ড)</button>
        <button class="tab-btn" onclick="switchMode('quiz')">Quiz (কুইজ)</button>
    </div>

    <!-- FLASHCARD MODE -->
    <div id="study-view">
        <div class="form-group">
            <label for="study-cat">ক্যাটাগরি নির্বাচন করুন:</label>
            <select id="study-cat" onchange="loadCategoryWords()">
                <option value="all">সব একসাথে (All Vocabulary)</option>
                <option value="pronouns">ব্যক্তি ও সর্বনাম (Pronouns)</option>
                <option value="suffixes">উপাধি ও সাফিক্স (Titles/Suffixes)</option>
                <option value="professions">পেশা ও স্থান (Professions/Places)</option>
                <option value="phrases">প্রশ্ন ও বাক্য (Phrases/Questions)</option>
                <option value="countries">দেশ সমূহের নাম (Countries)</option>
                <option value="extras">অতিরিক্ত শব্দ (Extra Words)</option>
            </select>
        </div>

        <div class="card-box">
            <div class="jp-text" id="fc-jp">わたし</div>
            <div class="kanji-text" id="fc-kanji">私 (watashi)</div>
            <div class="mean-text" id="fc-mean">আমি / I</div>
        </div>

        <div class="nav-btns">
            <button class="nav-btn" onclick="prevCard()">আগেরটি</button>
            <button class="nav-btn" onclick="toggleMeaning()">অর্থ লুকান/দেখুন</button>
            <button class="nav-btn" onclick="nextCard()">পরেরটি</button>
        </div>
    </div>

    <!-- QUIZ SETUP MODE -->
    <div id="quiz-setup" class="hidden">
        <h2 style="font-size: 1.3rem; color: #2d3748; margin-bottom: 15px;">Lesson 1 Quiz Setup</h2>
        <div class="form-group">
            <label for="quiz-cat">ক্যাটাগরি:</label>
            <select id="quiz-cat">
                <option value="all">সব একসাথে (All)</option>
                <option value="pronouns">ব্যক্তি ও সর্বনাম</option>
                <option value="suffixes">উপাধি ও সাফিক্স</option>
                <option value="professions">পেশা ও স্থান</option>
                <option value="phrases">প্রশ্ন ও বাক্য</option>
                <option value="countries">দেশ সমূহের নাম</option>
            </select>
        </div>
        <div class="form-group">
            <label for="quiz-limit">প্রশ্নের সংখ্যা:</label>
            <select id="quiz-limit">
                <option value="10">10 Questions</option>
                <option value="20">20 Questions</option>
                <option value="all">সবগুলো</option>
            </select>
        </div>
        <button class="btn-primary" onclick="startQuiz()">কুইজ শুরু করুন</button>
    </div>

    <!-- QUIZ ACTIVE MODE -->
    <div id="quiz-active" class="hidden">
        <div class="progress" id="quiz-progress">Question 1 of 10</div>
        <div class="card-box" style="min-height: 120px;">
            <div class="jp-text" id="qz-question">わたし</div>
        </div>
        <div class="options-grid" id="qz-options"></div>
    </div>

    <!-- QUIZ RESULT MODE -->
    <div id="quiz-result" class="hidden" style="text-align: center;">
        <h2 style="color: #2d3748;">কুইজ সম্পন্ন হয়েছে!</h2>
        <p id="qz-score" style="font-size: 1.2rem; font-weight: bold; color: #3182ce; margin: 20px 0;"></p>
        <button class="btn-primary" onclick="resetQuiz()">আবার চেষ্টা করুন</button>
    </div>
</div>

<script>
const lesson1Data = {
    pronouns: [
        {j: "わたし", k: "私", r: "watashi", bn: "আমি", en: "I"},
        {j: "わたしたち", k: "私たち", r: "watashitachi", bn: "আমরা", en: "We"},
        {j: "わたしの", k: "私の", r: "watashino", bn: "আমার", en: "My"},
        {j: "あなた", k: "あなた", r: "anata", bn: "তুমি / আপনি", en: "You"},
        {j: "あなたの", k: "あなたの", r: "anatano", bn: "তোমার / আপনার", en: "Your"},
        {j: "あのひと", k: "あの人", r: "anohito", bn: "ঐ ব্যক্তি / সে", en: "That person / He / She"},
        {j: "あのかた", k: "あの方", r: "anokata", bn: "ঐ ব্যক্তি (ভদ্র রূপ)", en: "That person (Polite)"},
        {j: "みなさん", k: "皆さん", r: "minasan", bn: "ভদ্রমহিলা ও মহোদয়গণ / সবাই", en: "Everyone / Ladies and Gentlemen"}
    ],
    suffixes: [
        {j: "～さん", k: "～さん", r: "san", bn: "জনাব / জনাবা", en: "Mr. / Mrs."},
        {j: "～ちゃん", k: "～ちゃん", r: "chan", bn: "বাচ্চাদের নামের শেষে", en: "Suffix for children/girls"},
        {j: "～くん", k: "～君", r: "kun", bn: "ছোট ছেলেদের নামের শেষে", en: "Suffix for boys"},
        {j: "～じん", k: "～人", r: "jin", bn: "নাগরিকত্ব বোঝাতে", en: "Nationality suffix"}
    ],
    professions: [
        {j: "せんせい", k: "先生", r: "sensei", bn: "শিক্ষক (অন্যকে ডাকতে)", en: "Teacher / Instructor"},
        {j: "きょうし", k: "講師", r: "kyoushi", bn: "শিক্ষক (নিজের পরিচয়ে)", en: "Teacher (as profession)"},
        {j: "がくせい", k: "学生", r: "gakusei", bn: "ছাত্র / ছাত্রী", en: "Student"},
        {j: "かいしゃいん", k: "会社員", r: "kaishain", bn: "কোম্পানির কর্মচারী", en: "Company employee"},
        {j: "しゃいん", k: "社員", r: "shain", bn: "নির্দিষ্ট কোম্পানির কর্মচারী", en: "Employee of ~ company"},
        {j: "ぎんこういん", k: "銀行員", r: "ginkoin", bn: "ব্যাংক কর্মকর্তা", en: "Bank employee"},
        {j: "いしゃ", k: "医者", r: "isha", bn: "ডাক্তার", en: "Medical doctor"},
        {j: "けんきゅうしゃ", k: "研究者", r: "kenkyuusha", bn: "গবেষক", en: "Researcher"},
        {j: "エンジニア", k: "エンジニア", r: "enjiniai", bn: "ইঞ্জিনিয়ার", en: "Engineer"},
        {j: "だいがく", k: "大学", r: "daigaku", bn: "বিশ্ববিদ্যালয়", en: "University"},
        {j: "びょういん", k: "病院", r: "byouin", bn: "হাসপাতাল", en: "Hospital"},
        {j: "でんき", k: "電気", r: "denki", bn: "বিদ্যুৎ / লাইট", en: "Electricity / Light"}
    ],
    phrases: [
        {j: "だれ", k: "誰", r: "dare", bn: "কে", en: "Who"},
        {j: "どなた", k: "どなた", r: "donata", bn: "কে (ভদ্র রূপ)", en: "Who (Polite)"},
        {j: "～さい", k: "～歳", r: "sai", bn: "বয়সের একক", en: "Years old"},
        {j: "なんさい", k: "何歳", r: "nansai", bn: "কত বছর বয়স?", en: "How old?"},
        {j: "おいくつ", k: "おいくつ", r: "oikutsu", bn: "কত বছর বয়স? (ভদ্র রূপ)", en: "How old? (Polite)"},
        {j: "はい", k: "はい", r: "hai", bn: "হ্যাঁ", en: "Yes"},
        {j: "いいえ", k: "いいえ", r: "iie", bn: "না", en: "No"},
        {j: "しつれいですが", k: "失礼ですが", r: "shitsureidesuga", bn: "ক্ষমা করবেন, কিন্তু...", en: "Excuse me, but..."},
        {j: "おなまえは？", k: "お名前は？", r: "onamaewa?", bn: "আপনার নাম কি?", en: "May I have your name?"},
        {j: "はじめまして", k: "初めまして", r: "hajimemashite", bn: "দেখা হয়ে ভালো লাগলো", en: "How do you do?"},
        {j: "どうぞよろしく", k: "どうぞよろしく", r: "douzo yoroshiku", bn: "পরিচিত হয়ে খুশি হলাম", en: "Pleased to meet you"},
        {j: "～からきました", k: "～から来ました", r: "karakimashita", bn: "～ থেকে এসেছি", en: "Came from ~"}
    ],
    countries: [
        {j: "アメリカ", k: "アメリカ", r: "amerika", bn: "আমেরিকা", en: "USA"},
        {j: "イギリス", k: "イギリス", r: "igirisu", bn: "যুক্তরাজ্য", en: "UK"},
        {j: "インド", k: "インド", r: "indo", bn: "ভারত", en: "India"},
        {j: "インドネシア", k: "インドネシア", r: "indonesia", bn: "ইন্দোনেশিয়া", en: "Indonesia"},
        {j: "かんこく", k: "韓国", r: "kankoku", bn: "দক্ষিণ কোরিয়া", en: "South Korea"},
        {j: "タイ", k: "タイ", r: "tai", bn: "থাইল্যান্ড", en: "Thailand"},
        {j: "ちゅうごく", k: "中国", r: "chuugoku", bn: "চীন", en: "China"},
        {j: "ドイツ", k: "ドイツ", r: "doitsu", bn: "জার্মানি", en: "Germany"},
        {j: "にほん", k: "日本", r: "nihon", bn: "জাপান", en: "Japan"},
        {j: "フランス", k: "フランス", r: "furansu", bn: "ফ্রান্স", en: "France"},
        {j: "ブラジル", k: "ブラジル", r: "burajiru", bn: "ব্রাজিল", en: "Brazil"}
    ],
    extras: [
        {j: "てんき", k: "天気", r: "tenki", bn: "আবহাওয়া", en: "Weather"},
        {j: "げんき", k: "元気", r: "genki", bn: "সুস্থ / চাঙ্গা", en: "Healthy / Fine"}
    ]
};

// FLASHCARD VARS
let currentCardList = [];
let cardIndex = 0;
let showMean = true;

// QUIZ VARS
let quizList = [];
let quizIndex = 0;
let score = 0;

function switchMode(mode) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById('study-view').classList.add('hidden');
    document.getElementById('quiz-setup').classList.add('hidden');
    document.getElementById('quiz-active').classList.add('hidden');
    document.getElementById('quiz-result').classList.add('hidden');

    if (mode === 'study') {
        event.target.classList.add('active');
        document.getElementById('study-view').classList.remove('hidden');
        loadCategoryWords();
    } else {
        event.target.classList.add('active');
        document.getElementById('quiz-setup').classList.remove('hidden');
    }
}

function loadCategoryWords() {
    const cat = document.getElementById('study-cat').value;
    if (cat === 'all') {
        currentCardList = [];
        Object.keys(lesson1Data).forEach(k => currentCardList.push(...lesson1Data[k]));
    } else {
        currentCardList = [...lesson1Data[cat]];
    }
    cardIndex = 0;
    renderCard();
}

function renderCard() {
    const item = currentCardList[cardIndex];
    document.getElementById('fc-jp').innerText = item.j;
    document.getElementById('fc-kanji').innerText = `${item.k} (${item.r})`;
    const meanElem = document.getElementById('fc-mean');
    meanElem.innerText = `${item.bn} / ${item.en}`;
    meanElem.style.visibility = showMean ? 'visible' : 'hidden';
}

function nextCard() {
    cardIndex = (cardIndex + 1) % currentCardList.length;
    renderCard();
}

function prevCard() {
    cardIndex = (cardIndex - 1 + currentCardList.length) % currentCardList.length;
    renderCard();
}

function toggleMeaning() {
    showMean = !showMean;
    renderCard();
}

// QUIZ LOGIC
function startQuiz() {
    const cat = document.getElementById('quiz-cat').value;
    const limit = document.getElementById('quiz-limit').value;

    let pool = [];
    if (cat === 'all') {
        Object.keys(lesson1Data).forEach(k => pool.push(...lesson1Data[k]));
    } else {
        pool = [...lesson1Data[cat]];
    }

    pool.sort(() => Math.random() - 0.5);
    const count = limit === 'all' ? pool.length : Math.min(parseInt(limit), pool.length);
    quizList = pool.slice(0, count);

    quizIndex = 0;
    score = 0;

    document.getElementById('quiz-setup').classList.add('hidden');
    document.getElementById('quiz-active').classList.remove('hidden');
    showQuizQuestion();
}

function showQuizQuestion() {
    const q = quizList[quizIndex];
    document.getElementById('quiz-progress').innerText = `Question ${quizIndex + 1} of ${quizList.length}`;
    document.getElementById('qz-question').innerText = q.j;

    let allPool = [];
    Object.keys(lesson1Data).forEach(k => allPool.push(...lesson1Data[k]));

    let options = [q];
    while (options.length < 4) {
        let rand = allPool[Math.floor(Math.random() * allPool.length)];
        if (!options.some(opt => opt.j === rand.j)) options.push(rand);
    }
    options.sort(() => Math.random() - 0.5);

    const container = document.getElementById('qz-options');
    container.innerHTML = '';
    options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerText = `${opt.bn} (${opt.en})`;
        btn.dataset.correct = (opt.j === q.j);
        btn.onclick = (e) => handleAnswer(e.target, opt.j === q.j);
        container.appendChild(btn);
    });
}

function handleAnswer(btn, isCorrect) {
    const allBtns = document.querySelectorAll('.opt-btn');
    allBtns.forEach(b => b.disabled = true);

    if (isCorrect) {
        btn.classList.add('correct');
        score++;
    } else {
        btn.classList.add('wrong');
        allBtns.forEach(b => {
            if (b.dataset.correct === 'true') b.classList.add('correct');
        });
    }

    setTimeout(() => {
        quizIndex++;
        if (quizIndex < quizList.length) {
            showQuizQuestion();
        } else {
            showQuizResult();
        }
    }, 1000);
}

function showQuizResult() {
    document.getElementById('quiz-active').classList.add('hidden');
    document.getElementById('quiz-result').classList.remove('hidden');
    document.getElementById('qz-score').innerText = `আপনি ${quizList.length} টির মধ্যে ${score} টি সঠিক উত্তর দিয়েছেন!`;
}

function resetQuiz() {
    document.getElementById('quiz-result').classList.add('hidden');
    document.getElementById('quiz-setup').classList.remove('hidden');
}

// Initial Load
loadCategoryWords();
</script>
</body>
</html>
