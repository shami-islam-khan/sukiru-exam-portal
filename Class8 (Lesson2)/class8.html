<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/logo.png">
    <title>Japanese Lesson 2 Practice</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: #ffffff; width: 100%; max-width: 600px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); padding: 25px; }
        
        .tab-buttons { display: flex; gap: 10px; margin-bottom: 20px; border-bottom: 2px solid #edf2f7; padding-bottom: 10px; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: #e2e8f0; color: #4a5568; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .tab-btn.active { background: #3182ce; color: white; }

        .form-group { margin-bottom: 15px; }
        label { font-weight: 600; font-size: 0.9rem; color: #4a5568; display: block; margin-bottom: 5px; }
        select { width: 100%; padding: 10px; border: 1.5px solid #cbd5e0; border-radius: 8px; font-size: 0.95rem; outline: none; background: white; }
        select:focus { border-color: #3182ce; }

        .btn-primary { width: 100%; padding: 12px; background: #3182ce; color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-primary:hover { background: #2b6cb0; }

        /* Flashcard Styles */
        .card-box { background: #edf2f7; border-radius: 12px; padding: 30px; text-align: center; margin-top: 15px; min-height: 180px; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .jp-text { font-size: 2.2rem; font-weight: bold; color: #2d3748; margin-bottom: 5px; }
        .kanji-text { font-size: 1.2rem; color: #718096; margin-bottom: 15px; }
        .mean-text { font-size: 1.1rem; color: #2b6cb0; font-weight: 600; }
        .nav-btns { display: flex; gap: 10px; margin-top: 15px; }
        .nav-btn { flex: 1; padding: 10px; background: #4a5568; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }

        /* Quiz Styles */
        .progress { font-size: 0.9rem; color: #718096; font-weight: 600; margin-bottom: 10px; }
        .options-grid { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 15px; }
        .opt-btn { background: #edf2f7; color: #2d3748; border: 2px solid #e2e8f0; font-size: 0.95rem; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: 600; text-align: left; transition: 0.2s; }
        .opt-btn:hover:not([disabled]) { background: #e2e8f0; }
        .opt-btn.correct { background: #48bb78 !important; color: white !important; border-color: #38a169 !important; }
        .opt-btn.wrong { background: #f56565 !important; color: white !important; border-color: #e53e3e !important; }

        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="tab-buttons">
        <button class="tab-btn active" onclick="switchMode('study')">Study (ফ্ল্যাশকার্ড)</button>
        <button class="tab-btn" onclick="switchMode('quiz')">Quiz (কুইজ)</button>
    </div>

    <!-- FLASHCARD MODE -->
    <div id="study-view">
        <div class="form-group">
            <label for="study-cat">ক্যাটাগরি নির্বাচন করুন:</label>
            <select id="study-cat" onchange="loadCategoryWords()">
                <option value="all">সব একসাথে (All Vocabulary)</option>
                <option value="demonstratives">নির্দেশক শব্দ (Demonstratives)</option>
                <option value="stationery">বই ও স্টেশনরি (Books/Stationery)</option>
                <option value="gadgets">ইলেকট্রনিক্স ও গাড়ি (Gadgets/Vehicles)</option>
                <option value="items">ব্যক্তিগত জিনিসপত্র (Personal Items)</option>
                <option value="language">ভাষা ও অভিব্যক্তি (Language/Phrases)</option>
            </select>
        </div>

        <div class="card-box">
            <div class="jp-text" id="fc-jp">これ</div>
            <div class="kanji-text" id="fc-kanji">これ (kore)</div>
            <div class="mean-text" id="fc-mean">এটা (কাছের বস্তু) / This</div>
        </div>

        <div class="nav-btns">
            <button class="nav-btn" onclick="prevCard()">আগেরটি</button>
            <button class="nav-btn" onclick="toggleMeaning()">অর্থ লুকান/দেখুন</button>
            <button class="nav-btn" onclick="nextCard()">পরেরটি</button>
        </div>
    </div>

    <!-- QUIZ SETUP MODE -->
    <div id="quiz-setup" class="hidden">
        <h2 style="font-size: 1.3rem; color: #2d3748; margin-bottom: 15px;">Lesson 2 Quiz Setup</h2>
        <div class="form-group">
            <label for="quiz-cat">ক্যাটাগরি:</label>
            <select id="quiz-cat">
                <option value="all">সব একসাথে (All)</option>
                <option value="demonstratives">নির্দেশক শব্দ</option>
                <option value="stationery">বই ও স্টেশনরি</option>
                <option value="gadgets">ইলেকট্রনিক্স ও গাড়ি</option>
                <option value="items">ব্যক্তিগত জিনিসপত্র</option>
                <option value="language">ভাষা ও অভিব্যক্তি</option>
            </select>
        </div>
        <div class="form-group">
            <label for="quiz-limit">প্রশ্নের সংখ্যা:</label>
            <select id="quiz-limit">
                <option value="10">10 Questions</option>
                <option value="20">20 Questions</option>
                <option value="all">সবগুলো</option>
            </select>
        </div>
        <button class="btn-primary" onclick="startQuiz()">কুইজ শুরু করুন</button>
    </div>

    <!-- QUIZ ACTIVE MODE -->
    <div id="quiz-active" class="hidden">
        <div class="progress" id="quiz-progress">Question 1 of 10</div>
        <div class="card-box" style="min-height: 120px;">
            <div class="jp-text" id="qz-question">これ</div>
        </div>
        <div class="options-grid" id="qz-options"></div>
    </div>

    <!-- QUIZ RESULT MODE -->
    <div id="quiz-result" class="hidden" style="text-align: center;">
        <h2 style="color: #2d3748;">কুইজ সম্পন্ন হয়েছে!</h2>
        <p id="qz-score" style="font-size: 1.2rem; font-weight: bold; color: #3182ce; margin: 20px 0;"></p>
        <button class="btn-primary" onclick="resetQuiz()">আবার চেষ্টা করুন</button>
    </div>
</div>

<script>
const lesson2Data = {
    demonstratives: [
        {j: "これ", k: "これ", r: "kore", bn: "এটা (কাছের বস্তু)", en: "This (thing here)"},
        {j: "それ", k: "それ", r: "sore", bn: "ওটা (২য় ব্যক্তির কাছের বস্তু)", en: "That (thing near you)"},
        {j: "あれ", k: "あれ", r: "are", bn: "ঐটা (অনেক দূরের বস্তু)", en: "That (thing over there)"},
        {j: "この～", k: "この～", r: "kono", bn: "এই ～ (কাছের বস্তুর নাম)", en: "this ～"},
        {j: "その～", k: "その～", r: "sono", bn: "ঐ ～ (২য় ব্যক্তির কাছের বস্তুর নাম)", en: "that ～"},
        {j: "あの～", k: "あの～", r: "ano", bn: "ঐ ～ (অনেক দূরের বস্তুর নাম)", en: "that ～ over there"}
    ],
    stationery: [
        {j: "ほん", k: "本", r: "hon", bn: "বই", en: "Book"},
        {j: "じしょ", k: "辞書", r: "jisho", bn: "অভিধান / ডিকশনারি", en: "Dictionary"},
        {j: "ざっし", k: "雑誌", r: "zasshi", bn: "ম্যাগাজিন", en: "Magazine"},
        {j: "しんぶん", k: "新聞", r: "shinbun", bn: "সংবাদপত্র / পত্রিকা", en: "Newspaper"},
        {j: "ノート", k: "ノート", r: "no-to", bn: "নোটবুক / খাতা", en: "Notebook"},
        {j: "てちょう", k: "手帳", r: "techou", bn: "পকেট নোটবুক", en: "Pocket notebook"},
        {j: "えんぴつ", k: "鉛筆", r: "enpitsu", bn: "পেন্সিল", en: "Pencil"},
        {j: "ボールペン", k: "ボールペン", r: "bo-rupen", bn: "বলপয়েন্ট কলম", en: "Ballpoint pen"},
        {j: "シャープペンシル", k: "シャープペンシル", r: "sha-pupenshiru", bn: "মেকানিক্যাল পেন্সিল", en: "Mechanical pencil"}
    ],
    gadgets: [
        {j: "カセットテープ", k: "カセットテープ", r: "kasettote-pu", bn: "ক্যাসেট টেপ", en: "Cassette tape"},
        {j: "テープレコーダー", k: "テープレコーダー", r: "te-pureko-da-", bn: "টেপ রেকর্ডার", en: "Tape recorder"},
        {j: "テレビ", k: "テレビ", r: "terebi", bn: "টেলিভিশন", en: "Television"},
        {j: "ラジオ", k: "ラジオ", r: "rajio", bn: "রেডিও", en: "Radio"},
        {j: "カメラ", k: "カメラ", r: "kamera", bn: "ক্যামেরা", en: "Camera"},
        {j: "コンピューター", k: "コンピューター", r: "konpyu-ta-", bn: "কম্পিউটার", en: "Computer"},
        {j: "じどうしゃ", k: "自動車", r: "jidousha", bn: "অটোমোবাইল / গাড়ি", en: "Automobile / Car"}
    ],
    items: [
        {j: "めいし", k: "名刺", r: "meishi", bn: "বিজনেস কার্ড / পরিচিতি কার্ড", en: "Business card"},
        {j: "カード", k: "カード", r: "ka-do", bn: "কার্ড", en: "Card"},
        {j: "テレホンカード", k: "テレホンカード", r: "terehonka-do", bn: "টেলিফোন কার্ড", en: "Telephone card"},
        {j: "かぎ", k: "鍵", r: "kagi", bn: "চাবি", en: "Key"},
        {j: "とけい", k: "時計", r: "tokei", bn: "ঘড়ি", en: "Watch / Clock"},
        {j: "かさ", k: "傘", r: "kasa", bn: "ছাতা", en: "Umbrella"},
        {j: "かばん", k: "かばん", r: "kaban", bn: "ব্যাগ / ব্রিফকেস", en: "Bag / Briefcase"},
        {j: "つくえ", k: "机", r: "tsukue", bn: "ডেস্ক", en: "Desk"},
        {j: "いす", k: "いす", r: "isu", bn: "চেয়ার", en: "Chair"},
        {j: "チョコレート", k: "チョコレート", r: "chokore-to", bn: "চকলেট", en: "Chocolate"},
        {j: "コーヒー", k: "コーヒー", r: "ko-hi-", bn: "কফি", en: "Coffee"}
    ],
    language: [
        {j: "えいご", k: "英語", r: "eigo", bn: "ইংরেজি ভাষা", en: "English language"},
        {j: "にほんご", k: "日本語", r: "nihongo", bn: "জাপানি ভাষা", en: "Japanese language"},
        {j: "～ご", k: "～語", r: "go", bn: "～ ভাষা", en: "～ language"},
        {j: "なん", k: "何", r: "nan", bn: "কী / কি", en: "What"},
        {j: "そう", k: "そう", r: "sou", bn: "তাই", en: "So"},
        {j: "ちがいます", k: "違います", r: "chigaimasu", bn: "না, তা নয় / ভুল", en: "No, it isn't / Wrong"},
        {j: "そうですか", k: "そうですか", r: "soudesuka", bn: "তাই নাকি? / বুঝতে পেরেছি", en: "Is that so? / I see"},
        {j: "あのお", k: "あのお", r: "anoo", bn: "ইয়ে... (দ্বিধা প্রকাশে)", en: "Well..."},
        {j: "ほんの きもちです", k: "ほんの 気持ちです", r: "honno kimochidesu", bn: "এটা সামান্য উপহার", en: "It's a token of my gratitude"},
        {j: "どうぞ", k: "どうぞ", r: "douzo", bn: "নিন / দয়া করে", en: "Please / Here you are"},
        {j: "どうも", k: "どうも", r: "doumo", bn: "ধন্যবাদ", en: "Thanks"},
        {j: "どうも ありがとう ございます", k: "どうも ありがとう ございます", r: "doumo arigatou gozaimasu", bn: "আপনাকে অসংখ্য ধন্যবাদ", en: "Thank you very much"},
        {j: "これから おせわに なります", k: "これから お世話に なります", r: "korekara osewani narimasu", bn: "ভবিষ্যতে আপনার সাহায্য আশা করি", en: "I hope for your kind assistance"},
        {j: "こちらこそ よろしく", k: "こちらこそ よろしく", r: "kochira koso yoroshiku", bn: "পরিচিত হয়ে খুব ভালো লাগলো", en: "Pleased to meet you, too"}
    ]
};

// FLASHCARD VARS
let currentCardList = [];
let cardIndex = 0;
let showMean = true;

// QUIZ VARS
let quizList = [];
let quizIndex = 0;
let score = 0;

function switchMode(mode) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.getElementById('study-view').classList.add('hidden');
    document.getElementById('quiz-setup').classList.add('hidden');
    document.getElementById('quiz-active').classList.add('hidden');
    document.getElementById('quiz-result').classList.add('hidden');

    if (mode === 'study') {
        event.target.classList.add('active');
        document.getElementById('study-view').classList.remove('hidden');
        loadCategoryWords();
    } else {
        event.target.classList.add('active');
        document.getElementById('quiz-setup').classList.remove('hidden');
    }
}

function loadCategoryWords() {
    const cat = document.getElementById('study-cat').value;
    if (cat === 'all') {
        currentCardList = [];
        Object.keys(lesson2Data).forEach(k => currentCardList.push(...lesson2Data[k]));
    } else {
        currentCardList = [...lesson2Data[cat]];
    }
    cardIndex = 0;
    renderCard();
}

function renderCard() {
    const item = currentCardList[cardIndex];
    document.getElementById('fc-jp').innerText = item.j;
    document.getElementById('fc-kanji').innerText = `${item.k} (${item.r})`;
    const meanElem = document.getElementById('fc-mean');
    meanElem.innerText = `${item.bn} / ${item.en}`;
    meanElem.style.visibility = showMean ? 'visible' : 'hidden';
}

function nextCard() {
    cardIndex = (cardIndex + 1) % currentCardList.length;
    renderCard();
}

function prevCard() {
    cardIndex = (cardIndex - 1 + currentCardList.length) % currentCardList.length;
    renderCard();
}

function toggleMeaning() {
    showMean = !showMean;
    renderCard();
}

// QUIZ LOGIC
function startQuiz() {
    const cat = document.getElementById('quiz-cat').value;
    const limit = document.getElementById('quiz-limit').value;

    let pool = [];
    if (cat === 'all') {
        Object.keys(lesson2Data).forEach(k => pool.push(...lesson2Data[k]));
    } else {
        pool = [...lesson2Data[cat]];
    }

    pool.sort(() => Math.random() - 0.5);
    const count = limit === 'all' ? pool.length : Math.min(parseInt(limit), pool.length);
    quizList = pool.slice(0, count);

    quizIndex = 0;
    score = 0;

    document.getElementById('quiz-setup').classList.add('hidden');
    document.getElementById('quiz-active').classList.remove('hidden');
    showQuizQuestion();
}

function showQuizQuestion() {
    const q = quizList[quizIndex];
    document.getElementById('quiz-progress').innerText = `Question ${quizIndex + 1} of ${quizList.length}`;
    document.getElementById('qz-question').innerText = q.j;

    let allPool = [];
    Object.keys(lesson2Data).forEach(k => allPool.push(...lesson2Data[k]));

    let options = [q];
    while (options.length < 4) {
        let rand = allPool[Math.floor(Math.random() * allPool.length)];
        if (!options.some(opt => opt.j === rand.j)) options.push(rand);
    }
    options.sort(() => Math.random() - 0.5);

    const container = document.getElementById('qz-options');
    container.innerHTML = '';
    options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerText = `${opt.bn} (${opt.en})`;
        btn.dataset.correct = (opt.j === q.j);
        btn.onclick = (e) => handleAnswer(e.target, opt.j === q.j);
        container.appendChild(btn);
    });
}

function handleAnswer(btn, isCorrect) {
    const allBtns = document.querySelectorAll('.opt-btn');
    allBtns.forEach(b => b.disabled = true);

    if (isCorrect) {
        btn.classList.add('correct');
        score++;
    } else {
        btn.classList.add('wrong');
        allBtns.forEach(b => {
            if (b.dataset.correct === 'true') b.classList.add('correct');
        });
    }

    setTimeout(() => {
        quizIndex++;
        if (quizIndex < quizList.length) {
            showQuizQuestion();
        } else {
            showQuizResult();
        }
    }, 1000);
}

function showQuizResult() {
    document.getElementById('quiz-active').classList.add('hidden');
    document.getElementById('quiz-result').classList.remove('hidden');
    document.getElementById('qz-score').innerText = `আপনি ${quizList.length} টির মধ্যে ${score} টি সঠিক উত্তর দিয়েছেন!`;
}

function resetQuiz() {
    document.getElementById('quiz-result').classList.add('hidden');
    document.getElementById('quiz-setup').classList.remove('hidden');
}

// Initial Load
loadCategoryWords();
</script>
</body>
</html>
